# 放进你 443 的 server 块里。手机浏览器只在 HTTPS 下允许录音。
# 需要 nginx 的 dav_ext 模块:apt install libnginx-mod-http-dav-ext

# 1) 网页和接口
location /live/ {
    proxy_pass http://127.0.0.1:8095/live/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;            # SSE 实时推送要关缓冲
    proxy_read_timeout 1h;
    client_max_body_size 30m;
}

# 2) 托管同步:每个用户一个私人 WebDAV 文件夹 /udav/<uid>/,密码文件按 uid 分开(后端自动生成)
location ~ "^/udav/(?<udav_uid>u[0-9a-f]{8})/" {
    root /srv;                      # 对应 DAV_ROOT=/srv/udav
    auth_basic "tingke sync";
    auth_basic_user_file /srv/udav-auth/$udav_uid.htpasswd;
    dav_methods PUT DELETE MKCOL COPY MOVE;
    dav_ext_methods PROPFIND OPTIONS;
    dav_access user:rw group:rw all:r;
    create_full_put_path on;
    charset utf-8;
}
