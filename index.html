.sw input:checked+span{background:var(--sun)} .sw input:checked+span::before{transform:translateX(16px)}
/* 底部悬浮控制条 */

canvas#wave{width:170px;height:30px}

.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(380px,92vw);background:#fff;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s var(--ease);display:flex;flex-direction:column}
.drawer.open{pointer-events:auto} .drawer.open .mask{opacity:1} .drawer.open .panel{transform:none}

.drawer .where{padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);word-break:break-all}

<body>
<header class="top">
  <div class="logo"><i>搭</i>听课搭子</div>
  <span class="course-now" id="courseNow"></span>
  <div class="spacer"></div>
  <label class="src"><span>声音来源</span><select id="device" aria-label="声音来源"></select></label>
  <span class="pill" id="bal" title="DeepSeek 余额,点一下刷新">DeepSeek <b id="balV">—</b></span>
  <button class="btn btn-ghost" id="openRecords" type="button">课堂记录</button>
</header>

<main>
  <section id="setup">
    <div class="setup-card">
      <h1>这节是<span class="hl">哪门课</span>?</h1>
      <p class="sub">记录会按课程分文件夹保存，文件名带日期和 AI 起的标题。课程列表在 .env 的 COURSES 里改。</p>
      <p class="label">课程</p>
      <div class="courses" id="courses"></div>
      <div class="start-row">
        <button class="btn btn-sun" id="startBtn" type="button" disabled>🎙 开始录制</button>
        <span class="hint" id="startHint">先选课程</span>
      </div>
      <div class="facts">
        <div class="fact"><b id="fDevice">语音识别</b><span id="fDeviceS">加载中…</span></div>
        <div class="fact"><b>翻译 · 总结</b><span id="fLLM">DeepSeek</span></div>
        <div class="fact"><b>提问提醒</b><span id="fQA">默认关闭，录制时可打开</span></div>
      </div>
      <p class="sig" id="sig">听课搭子 · 免费使用 · 源码公开</p>
    </div>
  </section>

  <section id="live">
    <div class="card">
      <div class="card-h">实时字幕 <small>英文原文 · 下面是中文翻译</small></div>
      <div class="scroll" id="trans"><div class="empty" id="transEmpty">等老师开口…</div></div>
      <div class="recog" id="recog" hidden>正在识别…</div>
    </div>
    <div class="col-r">
      <div class="card qa-card" id="qaCard">
        <div class="card-h">提问提醒 <small class="h-on">老师提问时给你中英文回答思路 · 学习辅助</small><small class="h-off">已关闭</small>
          <label class="sw r" title="开关提问提醒"><input type="checkbox" id="qaOn"><span></span></label>
        </div>
        <div class="scroll" id="qa"><div class="empty" id="qaEmpty">还没有人提问。</div></div>
      </div>
      <div class="card sum">
        <div class="card-h"><span class="dot"></span>AI 总结 <small>按主题 · 约每 40 秒更新</small></div>
        <div class="scroll" id="summary"><div class="empty">讲过一段内容后，这里会按主题出现要点。</div></div>
      </div>
    </div>
  </section>

  <div class="ctrl" id="ctrl" hidden>
    <span class="rec" id="timer">00:00:00</span>
    <canvas id="wave"></canvas>
    <button class="btn btn-ghost" id="pauseBtn" type="button">暂停</button>
    <button class="btn btn-ink" id="stopBtn" type="button">下课，保存笔记</button>
  </div>
</main>

<div class="drawer" id="drawer">
  <div class="mask" id="drawerMask"></div>
  <aside class="panel" aria-label="课堂记录">
    <div class="ph">课堂记录 <button type="button" id="closeRecords" aria-label="关闭">×</button></div>
    <div id="records"><div class="empty">加载中…</div></div>
    <div class="where" id="where"></div>
  </aside>
</div>
<div id="toast" hidden></div>

<script>
const $ = s => document.querySelector(s);
let S = {state:"idle"}, courses = [], chosen = null, tick = null, t0 = 0, base = 0;
function fmt(s){ s=Math.max(0,Math.floor(s)); const p=n=>String(n).padStart(2,"0"); return p(s/3600|0)+":"+p(s%3600/60|0)+":"+p(s%60); }
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function toast(msg, level="info", link=null){
  const t=$("#toast"); t.className=level; t.innerHTML=esc(msg)+(link?`<a id="tl">打开笔记</a>`:""); t.hidden=false;
  if(link) $("#tl").onclick=()=>openUri(link);
  clearTimeout(t._h); if(level!=="error") t._h=setTimeout(()=>t.hidden=true, link?15000:6000);
}
function openUri(uri){ fetch("/open",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uri})}); }
function lsGet(k){ try{return localStorage.getItem(k)}catch(e){return null} }
function lsSet(k,v){ try{localStorage.setItem(k,v)}catch(e){} }

async function loadConfig(){
  const c = await (await fetch("/config")).json();
  courses = c.courses;
  $("#courses").innerHTML = courses.map((x,i)=>{ const [code,...rest]=x.split(" ");
    return `<button type="button" class="course" data-i="${i}"><b>${esc(code)}</b><small>${esc(rest.join(" "))}</small></button>`; }).join("");
  document.querySelectorAll(".course").forEach(b=>b.onclick=()=>{
    document.querySelectorAll(".course").forEach(x=>x.classList.remove("on")); b.classList.add("on"); chosen=courses[+b.dataset.i]; refreshStart(); });
  const saved = lsGet("device");
  $("#device").innerHTML = c.devices.map(d=>`<option value="${esc(d.id)}">${esc(d.name)}</option>`).join("");
  const pick = c.devices.find(d=>d.id===saved) || c.devices.find(d=>d.default) || c.devices[0];
  if(pick) $("#device").value = pick.id;
  $("#device").onchange = ()=>{ lsSet("device",$("#device").value); refreshStart(); };
  const st = c.state;
  $("#where").textContent = "保存位置：" + c.record_root;
  if(c.app) $("#sig").innerHTML = `${esc(c.app.name)} v${esc(c.app.version)} · 免费使用 · 源码公开 · <a href="${esc(c.app.home)}" target="_blank" rel="noopener">原始仓库</a>`;
  $("#fDevice").textContent = st.device==="cuda" ? "语音识别 · 显卡加速" : "语音识别 · CPU 模式";
  $("#fDeviceS").textContent = st.model + (st.device==="cuda" ? "" : "（没检测到 N 卡，准确率低一些）");
  $("#fLLM").textContent = st.translate ? "DeepSeek 已连接" : "未填 Key：只显示英文（在 .env 里填 DEEPSEEK_API_KEY）";
  applyState(st);
}
function refreshStart(){
  const ok = chosen && S.model_ready && $("#device").value;
  $("#startBtn").disabled = !ok;
  $("#startHint").textContent = !chosen ? "先选课程" : !S.model_ready ? "语音模型加载中（第一次会自动下载，稍等）…" : "将录制："+chosen;
}
async function loadRecords(){
  const r = await (await fetch("/records")).json();
  $("#records").innerHTML = r.length ? r.map(g=>`<div class="grp">${esc(g.group)}</div>`+
    g.items.map(it=>`<div class="rec-item" data-u="${esc(it.uri)}" title="${esc(it.when+" "+it.title)}"><span class="t">${esc(it.title||it.when)}</span><span class="w">${esc((it.when||"").slice(5,10))}</span></div>`).join("")).join("")
    : `<div class="empty">还没有记录。上完第一节课，记录会出现在这里。</div>`;
  document.querySelectorAll(".rec-item").forEach(e=>e.onclick=()=>openUri(e.dataset.u));
}
$("#openRecords").onclick=()=>{ $("#drawer").classList.add("open"); loadRecords(); };
$("#closeRecords").onclick=$("#drawerMask").onclick=()=>$("#drawer").classList.remove("open");

function applyState(st){
  S = st;
  if(st.auto_qa!==undefined){ $("#qaOn").checked = st.auto_qa; syncQa(); }
  const live = st.state!=="idle";
  document.body.classList.toggle("live", live);
  $("#ctrl").hidden = !live;
  $("#device").disabled = live;
  if(live){
    const [code,...rest] = (st.course||"").split(" ");
    if(st.device_id) $("#device").value = st.device_id;
    $("#courseNow").innerHTML = `<b>${esc(code)}</b>${esc(rest.join(" "))}`;
    base = st.elapsed; t0 = performance.now();
    $("#ctrl").classList.toggle("paused", st.state!=="recording");
    $("#pauseBtn").textContent = st.state==="paused" ? "继续" : "暂停";
    $("#pauseBtn").disabled = $("#stopBtn").disabled = st.state==="saving";
    $("#stopBtn").textContent = st.state==="saving" ? "正在保存…" : "下课，保存笔记";
    clearInterval(tick);
    const draw=()=>{ $("#timer").textContent=fmt(base + (S.state==="recording" ? (performance.now()-t0)/1000 : 0)); };
    draw(); tick=setInterval(draw,500);
  } else {
    clearInterval(tick);
    $("#trans").innerHTML = `<div class="empty" id="transEmpty">等老师开口…</div>`;
    $("#summary").innerHTML = `<div class="empty">讲过一段内容后，这里会按主题出现要点。</div>`;
    $("#qa").innerHTML = `<div class="empty" id="qaEmpty">还没有人提问。</div>`;
    $("#recog").hidden = true;
    refreshStart();
  }
}
function nearBottom(el){ return el.scrollHeight - el.scrollTop - el.clientHeight < 80; }
function addSeg(s){
  if(document.getElementById("s"+s.id)) return;
  const box=$("#trans"), stick=nearBottom(box); $("#transEmpty")?.remove();
  box.querySelectorAll(".seg.latest").forEach(x=>x.classList.remove("latest"));
  const d=document.createElement("div"); d.className="seg latest"; d.id="s"+s.id;
  d.innerHTML=`<div class="ts">${esc(s.t)}<small>${esc(s.clock)}</small></div><div><div class="en">${esc(s.en)}</div><div class="zh">${esc(s.zh||"")}</div></div>`;
  box.appendChild(d); if(stick) box.scrollTop=box.scrollHeight;
}
function setZh(id, zh){ const e=document.querySelector("#s"+id+" .zh"); if(!e) return; const box=$("#trans"), stick=nearBottom(box); e.textContent=zh; if(stick) box.scrollTop=box.scrollHeight; }
function renderSummary(items){
  if(!items||!items.length) return;
  $("#summary").innerHTML = items.map(sec=>`<div class="sum-sec"><div class="topic">${esc(sec.topic)}</div><ul>`+
    (sec.points||[]).map(p=>`<li><b>${esc(p.k)}</b>：${esc(p.v)}</li>`).join("")+`</ul></div>`).join("");
}
function addQA(q){
  if(document.getElementById("qa"+q.id)) return; $("#qaEmpty")?.remove();
  const d=document.createElement("div"); d.className="qa new"; d.id="qa"+q.id;
  d.innerHTML=`<div class="qh"><span>${esc(q.t)}</span>老师在提问</div><div class="qq">${esc(q.question_zh)}</div><div class="qen">${esc(q.question_en)}</div>
    <div class="azh">${esc(q.answer_zh)}</div><div class="aen"><span>${esc(q.answer_en)}</span><button type="button">复制</button></div><div class="qf">学习辅助 · 仅供参考</div>`;
  d.querySelector("button").onclick=e=>{ navigator.clipboard?.writeText(q.answer_en).catch(()=>{}); e.target.textContent="已复制"; };
  $("#qa").prepend(d); $("#qa").scrollTop=0;
}
function syncQa(){ $("#qaCard").classList.toggle("off", !$("#qaOn").checked); }
$("#qaOn").onchange=()=>{ syncQa(); post("/autoqa",{on:$("#qaOn").checked}); };

const levels = new Array(40).fill(0);
function drawWave(){
  const c=$("#wave"); if(c.offsetWidth){ const dpr=devicePixelRatio||1;
    if(c.width!==c.offsetWidth*dpr){ c.width=c.offsetWidth*dpr; c.height=c.offsetHeight*dpr; }
    const g=c.getContext("2d"), n=levels.length, w=c.width/n, H=c.height; g.clearRect(0,0,c.width,H);
    g.fillStyle = S.state==="recording" ? "#2F7BEA" : "#CBD5E1";
    levels.forEach((v,i)=>{ const h=Math.max(3*dpr, v*H); g.beginPath(); (g.roundRect? g.roundRect(i*w+w*.3,(H-h)/2,w*.4,h,w*.2) : g.rect(i*w+w*.3,(H-h)/2,w*.4,h)); g.fill(); }); }
  requestAnimationFrame(drawWave);
}
drawWave();

async function post(url, body){
  const r = await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})});
  const j = await r.json().catch(()=>({})); if(!r.ok && j.msg) toast(j.msg,"error"); return j;
}
$("#startBtn").onclick=()=>post("/start",{course:chosen, device_id:$("#device").value});
$("#pauseBtn").onclick=()=>post("/pause");
$("#stopBtn").onclick=()=>{ if(confirm("下课了？结束录制并保存笔记。")) post("/stop"); };

function connect(){
  const es = new EventSource("/stream");
  es.onmessage = e=>{
    const m = JSON.parse(e.data);
    if(m.type==="state"){ const was=S.state; applyState({...S,...m}); if(was!==m.state) loadBalance(true); }
    else if(m.type==="seg") addSeg(m);
    else if(m.type==="seg_zh") setZh(m.id, m.zh);
    else if(m.type==="summary") renderSummary(m.items);
    else if(m.type==="qa") addQA(m);
    else if(m.type==="level"){ levels.shift(); levels.push(m.v); }
    else if(m.type==="recognizing") $("#recog").hidden = !(m.on && S.state!=="idle");
    else if(m.type==="status"){ toast(m.msg, m.level); if(/就绪/.test(m.msg)){ S.model_ready=true; refreshStart(); } }
    else if(m.type==="saved"){ toast("笔记已保存："+m.path, "ok", m.uri); loadBalance(true); }
  };
  es.onerror = ()=>{ es.close(); toast("和后台断开了，3 秒后重连…","error"); setTimeout(connect,3000); };
}
async function loadBalance(force){
  try{
    const b = await (await fetch("/balance"+(force?"?force=1":""))).json();
    if(!b.ok){ $("#balV").textContent="查不到"; return; }
    const sym = b.currency==="CNY" ? "¥" : "$";
    $("#balV").textContent = sym + b.total.toFixed(2) + (b.session_used!=null ? ` · 本节 ${sym}${b.session_used.toFixed(2)}` : "");
    $("#bal").classList.toggle("low", b.total < 5 || !b.available);
    $("#bal").title = !b.available ? "余额不足，翻译和总结会停，去 platform.deepseek.com 充值" : "DeepSeek 余额，点一下刷新";
  }catch(e){ $("#balV").textContent="查不到"; }
}
$("#bal").onclick=()=>loadBalance(true);
setInterval(()=>loadBalance(false),120000);
loadConfig().then(()=>{ loadBalance(true); connect(); });
</script>
